name: Remote firmware - Keil build test
run-name: Remote firmware ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifier used by the Mac launcher to find this exact run
        required: false
        default: manual

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      KEIL_USE_EXISTING: "1"
      KEIL_INSTALL_DIR: ${{ vars.KEIL_ROOT }}
      REMOTE_ROOT: 2_remote_test/rc_endu_test

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check self-hosted runner prerequisites
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          if ($env:RUNNER_NAME -ne 'PAILIKEN') { throw 'This workflow expects the PAILIKEN runner.' }
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $OutputEncoding = [Console]::OutputEncoding
          Get-Command git -ErrorAction Stop | Out-Null
          Get-Command python -ErrorAction Stop | Out-Null
          python -c "import sys; print(sys.version); assert sys.version_info >= (3, 10), 'Python 3.10+ required'"
          if ($LASTEXITCODE -ne 0) { throw 'Install Python 3.10+ on PAILIKEN and add it to PATH, then restart the runner.' }
          New-Item -ItemType Directory -Force ci-logs | Out-Null

      - name: Check CI deployment and timeout helpers
        run: |
          python -B -c "import sys, unittest; suite = unittest.defaultTestLoader.discover('scripts/tests'); result = unittest.TextTestRunner(stream=sys.stdout, verbosity=2).run(suite); sys.exit(not result.wasSuccessful())" | Tee-Object ci-logs/helper-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'CI helper regression tests failed.' }

      - name: Inspect existing Keil and verify its license
        timeout-minutes: 5
        run: |
          python -u scripts/keil_existing.py | Tee-Object ci-logs/existing-keil-check.log
          if ($LASTEXITCODE -ne 0) { throw 'Existing Keil check failed. Inspect existing-keil-check.log and license-probe-link.log.' }

      - name: Prepare project for detected ARM Compiler 5
        run: |
          python scripts/prepare_remote_ci.py | Tee-Object ci-logs/prepare.log
          if ($LASTEXITCODE -ne 0) { throw 'CI project preparation failed.' }

      - name: Rebuild firmware with bounded process monitoring
        timeout-minutes: 10
        run: |
          python -u scripts/keil_ci.py build
          if ($LASTEXITCODE -ne 0) { throw 'Keil build failed; inspect ci-logs/build.log and keil-build.log.' }

      - name: Upload application firmware
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: remote-firmware-app
          path: |
            2_remote_test/rc_endu_test/Output/BIN/*ENDU_TEST*.bin
            2_remote_test/rc_endu_test/Output/apm32f407.hex
            ci-logs/firmware-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Redact license server details from diagnostic artifacts
        id: redact_diagnostics
        if: always()
        run: |
          python -u scripts/keil_ci.py redact
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic redaction failed.' }

      - name: Upload diagnostics even on failure
        if: always() && steps.redact_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: remote-keil-diagnostics
          path: |
            ci-logs/
            2_remote_test/rc_endu_test/Output/*.map
            2_remote_test/rc_endu_test/Output/*.htm
            2_remote_test/rc_endu_test/Output/*.build_log.htm
            2_remote_test/rc_endu_test/Projects/MDK-ARM/CatchXBlack_Pro.ci.uvprojx
          retention-days: 14

      - name: Write run summary
        if: always()
        run: |
          @'
          ### Remote firmware build test
          - Runs on the existing PAILIKEN Windows self-hosted runner.
          - No tool downloads, installation, registry writes or license configuration changes.
          - Compiler version and paths are detected from the existing installation; see existing-keil.json.
          - The existing license must pass a link probe larger than 32 KiB before compiling firmware.
          - Download `remote-keil-diagnostics` on failure; inspect existing-keil-check.log, license-probe-link.log or keil-build.log.
          - `remote-firmware-app` is uploaded only after a successful build and BIN validation.
          - Application BIN base: 0x08010000. Bootloader is not included.
          - This build has not been validated on a remote controller.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
