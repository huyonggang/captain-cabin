plugins { id 'com.android.application' }
android {
    namespace 'com.rippton.endutest'
    compileSdk 35
    defaultConfig { applicationId 'com.rippton.endutest'; minSdk 24; targetSdk 34; versionCode 3; versionName '0.3-test' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.8.1' }
